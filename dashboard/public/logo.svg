<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00D2FF" />
      <stop offset="50%" stopColor="#0EA5E9" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00D2FF" stop-opacity="0.35" />
      <stop offset="100%" stopColor="#10B981" stop-opacity="0" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00D2FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Mark -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="url(#glowGrad)" />

    <!-- Modern Minimalist Shield Silhouette -->
    <path d="M 30 4 
             C 44 4, 54 13, 54 26 
             C 54 42, 38 52, 30 56 
             C 22 52, 6 42, 6 26 
             C 6 13, 16 4, 30 4 Z" 
          fill="url(#cyanGrad)" 
          filter="url(#cyanGlow)" />

    <!-- Cutout core -->
    <path d="M 30 11
             C 38 11, 46 17, 46 26
             C 46 36, 36 44, 30 48
             C 24 44, 14 36, 14 26
             C 14 17, 22 11, 30 11 Z"
          fill="#0A0D14" />

    <!-- Inner organic sprout & sensor beam -->
    <path d="M 30 16
             C 34 20, 38 27, 30 42
             C 28 32, 24 24, 30 16 Z"
          fill="url(#cyanGrad)" />

    <!-- Radar sensor line -->
    <path d="M 30 29 L 42 29 C 43 29, 44 30, 44 31 C 44 32, 43 33, 42 33 L 30 33 Z"
          fill="#00D2FF" />
    
    <circle cx="42" cy="18" r="3" fill="#00D2FF" />
  </g>

  <!-- Typography -->
  <g transform="translate(82, 0)">
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Plus Jakarta Sans', sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#F1F5F9">
      GUARDIAN
    </text>
    <circle cx="188" cy="41" r="3.5" fill="#00D2FF" />
    <text x="1" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="2.8" fill="#64748B" text-transform="uppercase">
      GEOSPATIAL AGRI-INTELLIGENCE
    </text>
  </g>
</svg>